<style>
:root{
  --bg:#06080e; --panel:#0d1119; --panel-2:#121826;
  --accent:#1460A8; --accent-2:#003D79; --accent-lite:#3b82f6; --accent-lite2:#7db3e8;
  --text:#FFFAFA; --text-dim:rgba(255,250,250,0.78); --border:rgba(255,255,255,0.09);
  --card:#FFFAFA; --card-text:#1e293b; --card-dim:#64748b;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans TC','M PLUS 1p',sans-serif;font-weight:400;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}

/* ===== NAV ===== */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
  padding:0 5vw;height:68px;background:rgba(6,8,14,0.72);backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(255,255,255,0.07);transition:background .4s,border-color .4s;}
nav.scrolled{background:rgba(11,14,26,0.96);border-bottom:1px solid rgba(255,255,255,0.1);}
.nav-logo img{border-radius:8px;display:block;}
.nav-links{display:flex;gap:2.2rem;list-style:none;align-items:center;margin-left:auto;}
.nav-links a{color:rgba(236,238,242,0.72);font-size:0.87rem;letter-spacing:0.03em;transition:color .2s;position:relative;}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .25s;border-radius:2px;}
.nav-links a:hover{color:#FFFAFA;}.nav-links a:hover::after{transform:scaleX(1);}
.nav-active{color:#FFFAFA!important;}.nav-active::after{transform:scaleX(1)!important;}
.nav-cta{background:#FFFAFA!important;color:#06080e!important;padding:0.45rem 1.2rem;border-radius:5px;font-weight:600;}
.nav-cta::after{display:none!important;}
.gc-lang-switcher{display:flex;align-items:center;margin-left:12px;}
.gc-lang-btn{display:flex;align-items:center;gap:4px;background:transparent;border:none;padding:4px 6px;border-radius:4px;cursor:pointer;color:rgba(255,255,255,0.55);font-size:14px;font-weight:600;letter-spacing:0.03em;font-family:inherit;transition:all .15s;}
.gc-lang-btn:hover,.gc-lang-btn.gc-btn-active{color:#fff;background:rgba(255,255,255,0.08);}
.gc-lang-dropdown{position:absolute;top:calc(100% + 8px);right:0;min-width:160px;background:#1e2535;border:1px solid rgba(255,255,255,0.12);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.3);overflow:hidden;display:none;z-index:200;}
.gc-lang-dropdown.gc-open{display:block;}
.gc-lang-option{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12px;font-weight:500;cursor:pointer;color:rgba(255,255,255,0.6);transition:background .1s;}
.gc-lang-option:hover{background:rgba(255,255,255,0.07);color:#fff;}
.gc-lang-name{font-weight:600;}.gc-lang-check{color:#4a9eff;margin-left:auto;font-size:11px;}
.gc-lang-sep{height:1px;background:rgba(255,255,255,0.07);}
.nav-right{display:none;align-items:center;gap:0.8rem;}
.nav-hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:26px;height:26px;background:none;border:none;cursor:pointer;padding:0;}
.nav-hamburger span{display:block;height:2px;width:100%;background:rgba(255,255,255,0.75);border-radius:2px;transition:all .25s;}
.nav-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.nav-hamburger.open span:nth-child(2){opacity:0;}
.nav-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.nav-mobile-menu{display:none;flex-direction:column;position:fixed;top:68px;left:0;right:0;background:rgba(11,14,26,0.98);border-bottom:1px solid rgba(255,255,255,0.1);padding:1rem 5vw 1.4rem;z-index:99;}
.nav-mobile-menu.open{display:flex;}
.nav-mobile-menu a{color:rgba(236,238,242,0.8);padding:0.7rem 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.95rem;}
@media(max-width:900px){.nav-links{display:none;}.nav-right{display:flex;}.nav-hamburger{display:flex;}}

/* ===== HEAD ===== */
.cat-head{max-width:1240px;margin:0 auto;padding:120px 5vw 10px;}
.cat-head .eyebrow{font-size:0.72rem;letter-spacing:0.22em;color:var(--accent-lite);font-weight:700;text-transform:uppercase;margin-bottom:14px;}
.cat-head h1{font-weight:800;font-size:2.5rem;letter-spacing:-0.02em;line-height:1.1;margin-bottom:14px;}
.cat-head p{color:var(--text-dim);font-size:0.98rem;line-height:1.7;white-space:nowrap;}

/* ===== TOOLBAR ===== */
.toolbar{max-width:1240px;margin:0 auto;padding:26px 5vw 8px;display:flex;flex-wrap:nowrap;gap:12px;align-items:center;}
.search{flex:2 1 200px;min-width:180px;position:relative;}
.search input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px 12px 40px;color:var(--text);font-size:0.9rem;font-family:inherit;}
.search input::placeholder{color:var(--text-dim);}
.search svg{position:absolute;left:13px;top:12px;opacity:0.5;}
.sel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:0.86rem;font-family:inherit;cursor:pointer;flex:1 1 0;min-width:120px;}
.sel option{background:#0d1119;}
.mini-chk{width:16px;height:16px;border-radius:4px;border:1.5px solid #46536b;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.mini-chk.on{background:var(--accent);border-color:var(--accent);}
.mini-chk.on::after{content:'✓';color:#fff;font-size:0.6rem;font-weight:700;}
.sel-all-btn{background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 15px;font-size:0.84rem;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0;}
.sel-all-btn:hover{border-color:var(--accent);}
.count{max-width:1240px;margin:0 auto;padding:12px 5vw 0;font-size:0.82rem;color:var(--text-dim);}
.count b{color:var(--text);}

/* ===== LIST ===== */
.list-wrap{max-width:1240px;margin:0 auto;padding:12px 5vw 75px;}
.list{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.lrow{display:grid;grid-template-columns:48px 2.5fr 1fr 0.9fr 0.9fr 1.2fr 128px;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);}
.lrow:last-child{border-bottom:none;}
.list-head{background:var(--panel-2);font-size:0.74rem;color:var(--text-dim);height:46px;}
.list-head .cell{font-weight:600;}
.lbody{min-height:76px;transition:background .15s;cursor:pointer;}
.lbody:hover{background:rgba(255,255,255,0.03);}
.lbody.sel{background:rgba(20,96,168,0.12);}
.cell{display:flex;align-items:center;gap:8px;padding:12px 6px;font-size:0.86rem;}
.chk{width:19px;height:19px;border-radius:5px;border:1.5px solid #46536b;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.chk.on{background:var(--accent);border-color:var(--accent);}
.chk.on::after{content:'✓';color:#fff;font-size:0.72rem;font-weight:700;}
.prod{gap:13px;}
.thumb{width:48px;height:48px;border-radius:9px;flex-shrink:0;background:#141b2b center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#4b5a72;}
.pname{line-height:1.3;min-width:0;}
.pname b{font-weight:700;font-size:0.92rem;color:var(--text);display:block;}
.pname span{display:block;color:var(--text-dim);font-size:0.72rem;margin-top:2px;}
.pname .m2meta{display:none;}
.pname .brand{color:var(--accent-lite2);font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:4px;}
.chip{background:rgba(20,96,168,0.16);color:var(--accent-lite2);font-size:0.68rem;padding:1px 8px;border-radius:20px;}
.muted{color:var(--text-dim);}
.mob-chips{display:none;}
.c-add{justify-content:flex-end;}
.add-row{border:1px solid var(--accent);background:transparent;color:var(--accent-lite);border-radius:8px;padding:7px 12px;font-size:0.78rem;font-weight:600;font-family:inherit;white-space:nowrap;cursor:pointer;transition:all .15s;}
.add-row:hover{background:rgba(20,96,168,0.1);}
.add-row.on{background:var(--accent);color:#fff;}
.empty{padding:50px;text-align:center;color:var(--text-dim);font-size:0.9rem;}
.loading{padding:60px;text-align:center;color:var(--text-dim);font-size:0.9rem;}

/* pager */
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:22px;flex-wrap:wrap;}
.pager button{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 13px;font-size:0.84rem;font-family:inherit;cursor:pointer;min-width:40px;}
.pager button:hover:not(:disabled){border-color:var(--accent);}
.pager button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.pager button:disabled{opacity:.4;cursor:not-allowed;}
.pager .pinfo{color:var(--text-dim);font-size:0.8rem;margin:0 6px;}

/* floating bar */
.floatbar{position:fixed;left:0;right:0;bottom:0;transform:translateY(100%);background:rgba(13,17,25,0.98);border-top:1px solid var(--border);padding:14px 5vw;display:flex;align-items:center;gap:16px;box-shadow:0 -8px 30px rgba(0,0,0,0.45);z-index:180;transition:transform .35s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(10px);}
.floatbar.show{transform:translateY(0);}
.fb-thumbs{display:flex;flex-shrink:0;}
.fb-thumbs .t{width:34px;height:34px;border-radius:7px;border:2px solid #0d1119;margin-left:-8px;background:#141b2b center/cover no-repeat;}
.fb-thumbs .t:first-child{margin-left:0;}
.fb-thumbs .more{width:34px;height:34px;border-radius:7px;border:2px solid #0d1119;margin-left:-8px;background:#26314a;display:flex;align-items:center;justify-content:center;font-size:0.66rem;color:#cbd5e1;font-weight:700;flex-shrink:0;}
.fb-info{font-size:0.9rem;white-space:nowrap;}
.fb-info b{color:var(--accent-lite);font-size:1.05rem;}
.fb-spacer{flex:1;}
.fb-clear{color:var(--text-dim);font-size:0.8rem;cursor:pointer;background:none;border:none;font-family:inherit;white-space:nowrap;}
.btn-primary{background:#FFFAFA;color:#06080e;border:none;padding:11px 22px;border-radius:9px;font-weight:700;font-size:0.88rem;cursor:pointer;font-family:inherit;transition:transform .2s;}
.btn-primary:hover{transform:translateY(-2px);}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(3,4,8,0.72);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.show{display:flex;}
.modal{background:#0d1119;border:1px solid var(--border);border-radius:20px;max-width:820px;width:100%;max-height:88vh;overflow-y:auto;position:relative;}
.modal-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.06);border:none;color:var(--text);width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer;z-index:5;}
.detail{display:grid;grid-template-columns:1fr 1fr;}
.detail-img{border-radius:20px 0 0 20px;min-height:340px;background:#0a0e16;display:flex;align-items:center;justify-content:center;font-size:5rem;color:#4b5a72;overflow:hidden;padding:16px;cursor:zoom-in;}
.detail-img img{max-width:100%;max-height:320px;object-fit:contain;border-radius:6px;}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:400;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;}
.lightbox.show{display:flex;}
.lightbox img{max-width:92vw;max-height:92vh;object-fit:contain;border-radius:8px;box-shadow:0 10px 50px rgba(0,0,0,0.6);}
.detail-body{padding:34px 32px;}
.detail-cat{font-size:0.72rem;color:var(--accent-lite);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px;}
.detail-body h2{font-size:1.5rem;font-weight:800;margin-bottom:6px;line-height:1.2;}
.detail-langs{color:var(--text-dim);font-size:0.82rem;margin-bottom:16px;line-height:1.6;}
.detail-desc{color:var(--text-dim);font-size:0.86rem;line-height:1.7;margin-bottom:20px;white-space:pre-wrap;}
.spec{border-top:1px solid var(--border);padding:13px 0;display:flex;justify-content:space-between;font-size:0.9rem;}
.spec .k{color:var(--text-dim);}.spec .v{font-weight:500;text-align:right;}
.price-box{background:rgba(20,96,168,0.1);border:1px dashed rgba(20,96,168,0.4);border-radius:12px;padding:14px 16px;margin:20px 0;font-size:0.86rem;color:var(--accent-lite2);}
.detail-add{width:100%;margin-top:6px;padding:13px;border-radius:10px;font-size:0.92rem;font-weight:700;cursor:pointer;font-family:inherit;background:var(--accent);color:#fff;border:none;}
.detail-add.on{background:#16a34a;}
.inq{padding:32px 34px 34px;}
.inq h2{font-size:1.4rem;font-weight:800;margin-bottom:6px;}
.inq .sub{color:var(--text-dim);font-size:0.86rem;margin-bottom:22px;}
.inq-list{background:var(--panel-2);border-radius:12px;padding:8px;margin-bottom:16px;max-height:230px;overflow-y:auto;}
.inq-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;}
.inq-thumb{width:42px;height:42px;border-radius:8px;flex-shrink:0;background:#141b2b center/cover no-repeat;}
.inq-item .nm{flex:1;font-size:0.88rem;}.inq-item .nm span{display:block;color:var(--text-dim);font-size:0.72rem;}
.inq-item .rm{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.9rem;}
.inq-toggle{width:100%;background:transparent;border:1px dashed var(--border);border-radius:9px;color:var(--accent-lite);font-size:0.8rem;font-weight:600;padding:9px;cursor:pointer;font-family:inherit;margin-bottom:20px;}
.inq-formhead{font-size:0.82rem;font-weight:700;color:var(--text);margin:4px 0 14px;padding-left:10px;border-left:3px solid var(--accent);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.field{display:flex;flex-direction:column;gap:6px;}.field.full{grid-column:1/-1;}
.field label{font-size:0.78rem;color:var(--text-dim);}.field label .req{color:#f87171;}
.field input,.field textarea{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:11px 13px;color:var(--text);font-size:0.88rem;font-family:inherit;}
.field textarea{resize:vertical;min-height:74px;}
.inq-submit{width:100%;background:#FFFAFA;color:#06080e;border:none;padding:14px;border-radius:10px;font-weight:700;font-size:0.95rem;cursor:pointer;font-family:inherit;margin-top:6px;transition:transform .2s;}
.inq-submit:hover{transform:translateY(-2px);}
.inq-submit:disabled{opacity:.5;cursor:not-allowed;}
.inq-mailnote{font-size:0.74rem;color:var(--text-dim);margin-top:12px;text-align:center;line-height:1.6;}
.success{padding:56px 40px;text-align:center;}
.success .ico{width:74px;height:74px;border-radius:50%;background:rgba(22,163,74,0.15);border:1px solid rgba(22,163,74,0.4);display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 22px;}
.success h2{font-size:1.5rem;font-weight:800;margin-bottom:12px;}
.success p{color:var(--text-dim);font-size:0.92rem;line-height:1.7;max-width:400px;margin:0 auto 26px;}

footer{background:rgba(6,8,14,0.9);padding:2.8rem 5vw;border-top:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.footer-copy{font-size:0.78rem;color:rgba(236,238,242,0.55);}

@media(max-width:900px){
  .cat-head{padding:100px 5vw 6px;} .cat-head h1{font-size:1.85rem;} .cat-head p{white-space:normal;font-size:0.9rem;}
  .toolbar{padding:20px 5vw 4px;gap:6px;flex-wrap:wrap;}
  .search{flex:1 1 100%;min-width:0;} .search input{padding:10px 8px 10px 28px;font-size:0.8rem;} .search svg{left:8px;}
  .sel{flex:1 1 0;min-width:0;padding:9px 5px;font-size:0.72rem;}
  .sel-all-btn{flex:1 1 100%;justify-content:center;padding:10px 8px;font-size:0.78rem;gap:6px;} .sel-all-btn .mini-chk{width:14px;height:14px;}
  .list-wrap{padding:12px 5vw 75px;}
  .list-head{display:none;}
  .lrow{grid-template-columns:26px 1fr;column-gap:11px;row-gap:9px;padding:13px 13px;align-items:start;}
  .cell{padding:0;} .lbody{min-height:0;}
  .c-chk{align-self:center;grid-row:1;grid-column:1;}
  .prod{grid-row:1;grid-column:2;gap:11px;align-items:center;}
  .thumb{width:44px;height:44px;}
  .pname b{font-size:0.88rem;} .pname .deskmeta{display:none;}
  .pname .m2meta{display:block;color:var(--accent-lite2);font-weight:600;font-size:0.68rem;margin-top:2px;}
  .c-cat,.c-origin,.c-shelf,.c-region,.c-add{display:none;}
  .mob-chips{display:flex;flex-wrap:wrap;gap:5px;grid-row:2;grid-column:2;}
  .detail{grid-template-columns:1fr;} .detail-img{border-radius:20px 20px 0 0;min-height:200px;}
  .form-grid{grid-template-columns:1fr;}
  .floatbar{padding:11px 16px;gap:9px;}
  .fb-thumbs .t,.fb-thumbs .more{width:30px;height:30px;}
  .fb-info{font-size:0.78rem;}
  .fb-clear{font-size:0.76rem;}
  .floatbar .btn-primary{padding:10px 13px;font-size:0.8rem;}
  footer{flex-direction:column;align-items:flex-start;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo"><img src="images/logo.png" alt="GC 跨境服務" style="width:50px;height:50px;"></a>
  <a href="index.html" style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:rgba(255,250,250,0.8);text-decoration:none;font-size:0.9rem;font-weight:500;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span data-i18n="form.nav.back">返回官網</span>
  </a>
  <div id="gcLangSwitcher" class="gc-lang-switcher" style="position:relative;">
    <button id="gcLangBtn" class="gc-lang-btn" onclick="gcToggleLangMenu()">
      <span id="gcLangLabel">繁中</span>
      <svg id="gcLangChev" class="gc-lang-chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div id="gcLangDropdown" class="gc-lang-dropdown">
      <div class="gc-lang-option gc-lang-active" data-lang="zh" onclick="gcSetLang('zh')"><span class="gc-lang-name">繁體中文</span><span class="gc-lang-check">✓</span></div>
      <div class="gc-lang-sep"></div>

function T(){ return UI[LANG()]||UI.zh; }
const CAT_I18N={
  '一般食品':{en:'General Food',ja:'一般食品'},'素食食品':{en:'Vegetarian Food',ja:'ベジタリアン食品'},
  '生鮮食品(冷藏冷凍)':{en:'Fresh / Frozen',ja:'生鮮食品(冷蔵冷凍)'},'保健食品':{en:'Health Supplements',ja:'健康食品'},
  '美妝與保養品':{en:'Beauty & Skincare',ja:'美容・スキンケア'},'寵物用品':{en:'Pet Products',ja:'ペット用品'},
  '母嬰用品':{en:'Baby & Maternity',ja:'ベビー・マタニティ'},'服裝與配件':{en:'Apparel & Accessories',ja:'アパレル・雑貨'},
  '運動用品':{en:'Sports',ja:'スポーツ用品'},'戶外、園藝':{en:'Outdoor & Garden',ja:'アウトドア・園芸'},
  '家電3C':{en:'Electronics',ja:'家電・デジタル'},'廚房用品、家居裝飾':{en:'Kitchen & Home',ja:'キッチン・インテリア'}
};
const COUNTRY_I18N={
  '台灣':{en:'Taiwan',ja:'台湾'},'日本':{en:'Japan',ja:'日本'},'韓國':{en:'Korea',ja:'韓国'},
  '馬來西亞':{en:'Malaysia',ja:'マレーシア'},'新加坡':{en:'Singapore',ja:'シンガポール'},'泰國':{en:'Thailand',ja:'タイ'},
  '美國':{en:'USA',ja:'アメリカ'},'歐洲':{en:'Europe',ja:'ヨーロッパ'},'中國':{en:'China',ja:'中国'},
  '香港':{en:'Hong Kong',ja:'香港'},'越南':{en:'Vietnam',ja:'ベトナム'}
};
function trCat(v){ const l=LANG(); if(l==='zh'||!v)return v||''; return (CAT_I18N[v]&&CAT_I18N[v][l])||v; }
function trCountry(v){ const l=LANG(); if(l==='zh'||!v)return v||''; return (COUNTRY_I18N[v]&&COUNTRY_I18N[v][l])||v; }
function pName(p){ const l=LANG(); return p['name_'+l]||p.name_zh||p.name_en||p.name_ja||'—'; }
function pShelf(p){ if(p.shelf_life_months==null||p.shelf_life_months==='')return null; return T().months(p.shelf_life_months); }
function pDesc(p){ var l=LANG(); return p['desc_'+l]||p.desc_zh||p.desc_en||''; }
function normBrand(b){ return String(b==null?"":b).replace(/[​‌‍﻿]/g,"").replace(/　/g," ").replace(/\s+/g," ").trim(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ====== 狀態 ====== */
let PRODUCTS=[];
let LOADED=false;   /* 商品是否已從 Supabase 載入完成 */
let LOADERR=null;   /* 載入失敗時的錯誤訊息 */
const selected=new Set();
let inqExpanded=false;
let curPage=1;
let detailId=null;

async function load(){
  try{
    const res=await fetch(REST+'public_products?select=*&order=category.asc,name_zh.asc',{headers:SB_HEADERS});
    if(!res.ok)throw new Error('HTTP '+res.status+' '+(await res.text()));
    PRODUCTS=await res.json();
    LOADED=true; LOADERR=null;
    buildFilters(); render();
  }catch(e){
    LOADERR=e.message;
    document.getElementById('rows').innerHTML='<div class="empty">'+T().err+'<br><span style="font-size:0.75rem;opacity:0.6;">'+esc(e.message)+'</span></div>';
    console.error('load error',e);
  }
}
function uniq(k){ return [...new Set(PRODUCTS.flatMap(p=>Array.isArray(p[k])?p[k]:[p[k]]).filter(Boolean))]; }
function buildFilters(){
  const fc=document.getElementById('fCat'), fb=document.getElementById('fBrand'), fr=document.getElementById('fRegion');
  const cv=fc.value, bv=fb.value, rv=fr.value;
  fc.innerHTML='<option value="">'+T().allCat+'</option>'+uniq('category').map(v=>`<option value="${esc(v)}">${esc(trCat(v))}</option>`).join('');
  var brands=[...new Set(PRODUCTS.map(p=>normBrand(p.brand)).filter(Boolean))].sort();
  fb.innerHTML='<option value="">'+T().allBrand+'</option>'+brands.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  var regions=[...new Set(PRODUCTS.flatMap(p=>p.stock_regions||[]).filter(Boolean))].sort();
  fr.innerHTML='<option value="">'+T().allRegion+'</option>'+regions.map(v=>`<option value="${esc(v)}">${esc(trCountry(v))}</option>`).join('');
  fc.value=cv; fb.value=bv; fr.value=rv;
}
function filtered(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const c=document.getElementById('fCat').value, b=document.getElementById('fBrand').value, rgn=document.getElementById('fRegion').value;
  return PRODUCTS.filter(p=>{
    if(q && !((p.name_zh||'')+(p.name_en||'')+(p.name_ja||'')+(p.brand||'')).toLowerCase().includes(q))return false;
    if(c && p.category!==c)return false;
    if(b && normBrand(p.brand)!==b)return false;
    if(rgn && !(p.stock_regions||[]).includes(rgn))return false;
    return true;
  });
}
function thumbStyle(p){ return p.photo_url?`background-image:url('${esc(p.photo_url)}')`:''; }

function onFilter(){ curPage=1; render(); }

function render(){
  const t=T();
  if(!LOADED){
    /* 載入完成前不重繪列表：保留「載入商品中…」或 SEO 預渲染內容，
       避免 i18n 初始化提早呼叫 render() 時閃現「找不到符合條件的商品」 */
    if(LOADERR) document.getElementById('rows').innerHTML='<div class="empty">'+t.err+'<br><span style="font-size:0.75rem;opacity:0.6;">'+esc(LOADERR)+'</span></div>';
    return;
  }
  const list=filtered();
  const total=list.length, pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(curPage>pages)curPage=pages; if(curPage<1)curPage=1;
  const pageItems=list.slice((curPage-1)*PAGE_SIZE, curPage*PAGE_SIZE);
  const allSel=list.length>0 && list.every(p=>selected.has(String(p.id)));
  document.getElementById('selAllChk').classList.toggle('on',allSel);
  document.getElementById('selAllTxt').textContent=allSel?t.unsel:t.selall(total);
  document.getElementById('count').innerHTML='<span>'+t.count('<b>'+total+'</b>')+'</span>';
  document.getElementById('listHead').innerHTML=
    `<div class="cell"></div><div class="cell">${t.prod}</div><div class="cell">${t.cat}</div><div class="cell">${t.origin}</div><div class="cell">${t.shelf}</div><div class="cell">${t.stock}</div><div class="cell"></div>`;
  const rows=document.getElementById('rows');
  if(!total){ rows.innerHTML='<div class="empty">'+t.empty+'</div>'; document.getElementById('pager').innerHTML=''; return; }
  rows.innerHTML=pageItems.map(p=>{
    const on=selected.has(String(p.id));
    const regions=(p.stock_regions||[]).map(trCountry);
    const chips=regions.map(r=>`<span class="chip">${esc(r)}</span>`).join('');
    const shelf=pShelf(p), shelfTxt=shelf||'—';
    const th=thumbStyle(p);
    return `<div class="lrow lbody ${on?'sel':''}" onclick="openDetail('${p.id}')">
      <div class="cell c-chk" onclick="event.stopPropagation();toggle('${p.id}')"><div class="chk ${on?'on':''}"></div></div>
      <div class="cell prod">
        <div class="thumb" style="${th}">${th?'':'📦'}</div>
        <div class="pname"><b>${esc(pName(p))}</b>
          <span class="deskmeta"><span class="brand">${esc(p.brand||'')}</span></span>
          <span class="m2meta"><span class="brand">${esc(p.brand||'')}</span></span>
        </div>
      </div>
      <div class="cell c-cat">${esc(trCat(p.category))}</div>
      <div class="cell c-origin">${esc(trCountry(p.origin))}</div>
      <div class="cell c-shelf"><span class="muted">${esc(shelfTxt)}</span></div>
      <div class="cell c-region"><span class="chips">${chips}</span></div>
      <div class="cell c-add" onclick="event.stopPropagation();toggle('${p.id}')"><button class="add-row ${on?'on':''}">${on?t.added:t.add}</button></div>
      <div class="mob-chips">
        <span class="chip">${t.cat} ${esc(trCat(p.category))}</span><span class="chip">${t.origin} ${esc(trCountry(p.origin))}</span>
        ${shelf?`<span class="chip">${t.shelf} ${esc(shelf)}</span>`:''}${regions.length?`<span class="chip">${t.stockp} ${esc(regions.join('/'))}</span>`:''}
      </div>
    </div>`;
  }).join('');
  renderPager(total,pages);
}
function renderPager(total,pages){
  const t=T(), el=document.getElementById('pager');
  if(pages<=1){ el.innerHTML=''; return; }
  const a=(curPage-1)*PAGE_SIZE+1, b=Math.min(total,curPage*PAGE_SIZE);
  let h=`<button ${curPage===1?'disabled':''} onclick="goPage(${curPage-1})">‹</button>`;
  const win=2; let start=Math.max(1,curPage-win), end=Math.min(pages,curPage+win);
  if(start>1){ h+=`<button onclick="goPage(1)">1</button>`; if(start>2)h+='<span class="pinfo">…</span>'; }
  for(let i=start;i<=end;i++) h+=`<button class="${i===curPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  if(end<pages){ if(end<pages-1)h+='<span class="pinfo">…</span>'; h+=`<button onclick="goPage(${pages})">${pages}</button>`; }
  h+=`<button ${curPage===pages?'disabled':''} onclick="goPage(${curPage+1})">›</button>`;
  h+=`<span class="pinfo">${t.pageinfo(a,b,total)}</span>`;
  el.innerHTML=h;
}
function goPage(n){ curPage=n; render(); var w=document.querySelector('.list-wrap'); window.scrollTo({top:w.offsetTop-80,behavior:'smooth'}); }

function P(id){ return PRODUCTS.find(x=>String(x.id)===String(id)); }
/* selected 一律存 String(id)，避免 Supabase id 為數字時與 onclick 傳入的字串比對不到 */
function toggle(id){ id=String(id); selected.has(id)?selected.delete(id):selected.add(id); render(); syncBar(); }
function toggleAll(){ const list=filtered(); const all=list.length>0&&list.every(p=>selected.has(String(p.id))); if(all)list.forEach(p=>selected.delete(String(p.id))); else list.forEach(p=>selected.add(String(p.id))); render(); syncBar(); }
function clearSel(){ selected.clear(); render(); syncBar(); }
function syncBar(){
  const items=[...selected].map(id=>P(id)).filter(Boolean);
  document.getElementById('fbCount').textContent=selected.size;
  const th=document.getElementById('fbThumbs');
  if(th){ const show=items.slice(0,3); let h=show.map(p=>`<div class="t" style="${p.photo_url?`background-image:url('${esc(p.photo_url)}')`:''}"></div>`).join(''); if(items.length>3) h+=`<div class="more">+${items.length-3}</div>`; th.innerHTML=h; }
  document.getElementById('floatbar').classList.toggle('show',selected.size>0);
}

function openDetail(id){
  id=String(id);
  detailId=id;
  const p=P(id), t=T(), on=selected.has(id);
  const shelf=pShelf(p), th=thumbStyle(p), desc=pDesc(p);
  document.getElementById('detailContent').innerHTML=`
    ${p.photo_url?`<div class="detail-img" onclick="openLightbox('${esc(p.photo_url)}')"><img src="${esc(p.photo_url)}" alt="${esc(pName(p))}"></div>`:'<div class="detail-img" style="cursor:default">📦</div>'}
    <div class="detail-body">
      <div class="detail-cat">${esc(trCat(p.category))}　·　${esc(p.brand||'')}</div>
      <h2>${esc(pName(p))}</h2>
      <div class="detail-langs">${esc(p.name_en||'')}${p.name_ja?'<br>'+esc(p.name_ja):''}</div>
      ${desc?`<div class="detail-desc">${esc(desc)}</div>`:''}
      <div class="spec"><span class="k">${t.origin}</span><span class="v">${esc(trCountry(p.origin))}</span></div>
      ${shelf?`<div class="spec"><span class="k">${t.shelf}</span><span class="v">${esc(shelf)}</span></div>`:''}
      <div class="spec"><span class="k">${t.stock}</span><span class="v">${esc((p.stock_regions||[]).map(trCountry).join('、')||'—')}</span></div>
      <div class="price-box">${t.priceNote}</div>
      <button class="detail-add ${on?'on':''}" onclick="toggle('${p.id}');openDetail('${p.id}')">${on?t.added:t.add}</button>
    </div>`;
  document.getElementById('detailOverlay').classList.add('show');
}
function closeDetail(){ detailId=null; document.getElementById('detailOverlay').classList.remove('show'); }
function openLightbox(url){ if(!url)return; document.getElementById('lightboxImg').src=url; document.getElementById('lightbox').classList.add('show'); }
function closeLightbox(){ document.getElementById('lightbox').classList.remove('show'); }

function openInquiryFresh(){ inqExpanded=false; openInquiry(); }
function toggleInqExpand(){ inqExpanded=!inqExpanded; openInquiry(); }
const INQ_FIELDS=['iq-company','iq-contact','iq-email','iq-other','iq-note'];
function openInquiry(){
  const t=T(), items=[...selected].map(id=>P(id)).filter(Boolean);
  const many=items.length>5, shown=(many&&!inqExpanded)?items.slice(0,5):items;
  /* 重繪前保存使用者已填的聯絡資料，重繪後回填（展開清單／移除商品不清空表單） */
  const keep={};
  INQ_FIELDS.forEach(fid=>{ const el=document.getElementById(fid); if(el)keep[fid]=el.value; });
  document.getElementById('inqContent').innerHTML=`
    <div class="inq">
      <h2>${t.selTitle(items.length)}${items.length?` <span onclick="clearSel();closeInquiry();" style="font-size:0.76rem;font-weight:500;color:var(--text-dim);cursor:pointer;margin-left:8px;">${t.clearAll}</span>`:''}</h2>
      <div class="sub">${t.selSub}</div>
      <div class="inq-list">
        ${items.length?shown.map(p=>`<div class="inq-item">
          <div class="inq-thumb" style="${thumbStyle(p)}"></div>
          <div class="nm">${esc(pName(p))}<span>${esc(p.brand||'')}｜${esc(trCat(p.category))}</span></div>
          <button class="rm" onclick="toggle('${p.id}');openInquiry()">✕</button>
        </div>`).join(''):'<div style="padding:22px;text-align:center;color:var(--text-dim);font-size:0.85rem;">—</div>'}
      </div>
      ${many?`<button class="inq-toggle" onclick="toggleInqExpand()">${inqExpanded?t.collapse:t.showAll(items.length)}</button>`:''}
      <div class="inq-formhead">${t.formHead}</div>
      <div class="form-grid">
        <div class="field"><label>${t.fCompany} <span class="req">*</span></label><input id="iq-company" placeholder="${t.company_ph}"></div>
        <div class="field"><label>${t.fContact} <span class="req">*</span></label><input id="iq-contact" placeholder="${t.contact_ph}"></div>
        <div class="field"><label>${t.fEmail} <span class="req">*</span></label><input id="iq-email" placeholder="you@example.com"></div>
        <div class="field"><label>${t.fOther}</label><input id="iq-other" placeholder="${t.other_ph}"></div>
        <div class="field full"><label>${t.fNote}</label><textarea id="iq-note" placeholder="${t.note_ph}"></textarea></div>
      </div>
      <button class="inq-submit" id="iqSubmit" onclick="submitInquiry()" ${items.length?'':'disabled'}>${t.submit(items.length)}</button>
      <div class="inq-mailnote">📧 ${t.mailNote}</div>
    </div>`;
  INQ_FIELDS.forEach(fid=>{ const el=document.getElementById(fid); if(el&&keep[fid]!==undefined)el.value=keep[fid]; });
  document.getElementById('inqOverlay').classList.add('show');
}
function closeInquiry(){ document.getElementById('inqOverlay').classList.remove('show'); }

async function submitInquiry(){
  const t=T(), items=[...selected].map(id=>P(id)).filter(Boolean);
  if(!items.length)return;
  const company=(document.getElementById('iq-company').value||'').trim();
  const contact=(document.getElementById('iq-contact').value||'').trim();
  const email=(document.getElementById('iq-email').value||'').trim();
  if(!company||!contact||!email){ alert(t.needContact); return; }
  const btn=document.getElementById('iqSubmit'); btn.disabled=true; btn.textContent=t.sending;
  const subId=(self.crypto&&crypto.randomUUID)?crypto.randomUUID():('inq-'+Date.now()+'-'+Math.random().toString(36).slice(2,10));
  const payload={
    submission_id:subId,
    company_name:company, contact_name:contact, email:email,
    other_contact:(document.getElementById('iq-other').value||'').trim(),
    message:(document.getElementById('iq-note').value||'').trim(),
    item_count:items.length,
    products:items.map(p=>({sku:p.sku,name:p.name_zh,name_en:p.name_en,brand:p.brand,category:p.category,origin:p.origin,stock_regions:p.stock_regions}))
  };
  try{
    const r=await fetch(REST+'inquiries',{method:'POST',headers:Object.assign({'Content-Type':'application/json',Prefer:'return=minimal'},SB_HEADERS),body:JSON.stringify([payload])});
    if(!r.ok){ console.warn('inquiry insert failed',await r.text()); throw new Error('inquiry insert failed: HTTP '+r.status); }
    /* 寄信端點失敗不阻斷流程（Supabase 已留底） */
    if(INQUIRY_ENDPOINT){ try{ await fetch(INQUIRY_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); }catch(mailErr){ console.warn('mail endpoint failed',mailErr); } }
  }catch(e){
    /* Supabase 留底失敗：不顯示成功畫面，恢復按鈕讓使用者重試 */
    console.error(e);
    btn.disabled=false; btn.textContent=t.submit(items.length);
    alert(t.sendErr);
    return;
  }
  document.getElementById('inqContent').innerHTML=`
    <div class="success"><div class="ico">✓</div><h2>${t.okTitle}</h2><p>${t.okBody(items.length)}</p>
    <button class="btn-primary" onclick="closeInquiry();clearSel();">${t.back}</button></div>`;
}

function catApplyLang(){
  const t=T();
  document.getElementById('catTitle').textContent=t.title;
  document.getElementById('catSub').textContent=t.sub;
  document.getElementById('q').placeholder=t.search;
  document.getElementById('fbLabel').textContent=t.fbLabel;
  document.getElementById('fbClear').textContent=t.clear;
  document.getElementById('fbView').textContent=t.view;
  document.title=t.title+' — GC 跨境服務';
  if(PRODUCTS.length){ buildFilters(); render(); }
  if(detailId && document.getElementById('detailOverlay').classList.contains('show')) openDetail(detailId);
}
document.addEventListener('gc:langchange', catApplyLang);
