# GC 官網 — Netlify 設定
# 每次部署前先跑預渲染：
#   build-seo.js  → 把 Supabase 的公開商品與 JSON-LD 灌進 catalog.html
#   build-blog.js → 產生每篇文章的實體靜態頁、灌列表頁、更新 sitemap
#   build-schema.js → 依首頁實際的常見問題與服務區塊產生 Organization/FAQPage 等結構化資料
# build-locales.js → 產生 /en/、/ja/ 的伺服器端靜態語言版本並更新 sitemap

[build]
  command = "node build-seo.js && node build-blog.js && node build-services.js && node build-schema.js && node build-locales.js"
  publish = "."          # ← 網站根目錄；若你的站台檔案不在 repo 根目錄，改成實際資料夾

[build.environment]
  NODE_VERSION = "20"

# ── 文章網址 ─────────────────────────────────────────────────────────
# 文章的正式網址是 /blog/<網址代稱>/。
# build-blog.js 會在部署時把每篇文章寫成實體檔案 blog/<slug>/index.html，
# 而 Netlify 服務實體檔案的優先序高於 redirects，所以：
#   · 已預渲染的文章 → 直接吃靜態頁，含完整內容與 JSON-LD（SEO 最佳）
#   · 不存在或尚未重新建置的文章 → Netlify 直接回傳真正的 404
# 新文章發佈後必須觸發一次部署，才會產生可索引的實體文章頁。

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/blog/"
  to = "/blog.html"
  status = 200
